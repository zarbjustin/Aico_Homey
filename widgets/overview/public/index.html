<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeLINK overview</title>
  <link rel="stylesheet" href="overview.css">
  <script src="overview.js"></script>
</head>
<body class="homey-widget">
  <main aria-label="HomeLINK overview">
    <dl class="metrics">
      <div class="metric">
        <dt>Cloud data</dt>
        <dd><strong id="reporting">—</strong><span id="coverage">Loading</span></dd>
      </div>
      <div class="metric">
        <dt>Maintenance</dt>
        <dd><strong id="maintenance">—</strong><span id="checked">Loading</span></dd>
      </div>
    </dl>
    <p id="status" class="status" role="status">Reading Homey’s last update</p>
  </main>
</body>
</html>
