name: Verify Homey app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:acceptance
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - run: npx --yes homey@4.5.3 app build
      - run: git diff --exit-code -- app.json
      - name: Verify and record the Homey package
        run: npm run check:package
      - run: npx --yes homey@4.5.3 app validate --level publish
